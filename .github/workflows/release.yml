name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: GabeTeX-Linux-Windows

      - name: Build frontend
        run: npm run build
        working-directory: GabeTeX-Linux-Windows

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli@latest
        working-directory: GabeTeX-Linux-Windows/src-tauri

      - name: Build Tauri app (Windows)
        run: npx tauri build
        working-directory: GabeTeX-Linux-Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GabeTeX-Linux-Windows/src-tauri/target/release/bundle/msi/*.msi
            GabeTeX-Linux-Windows/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci
        working-directory: GabeTeX-Linux-Windows

      - name: Build frontend
        run: npm run build
        working-directory: GabeTeX-Linux-Windows

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli@latest
        working-directory: GabeTeX-Linux-Windows/src-tauri

      - name: Build Tauri app (Linux)
        run: npx tauri build
        working-directory: GabeTeX-Linux-Windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GabeTeX-Linux-Windows/src-tauri/target/release/bundle/appimage/*.AppImage
            GabeTeX-Linux-Windows/src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
