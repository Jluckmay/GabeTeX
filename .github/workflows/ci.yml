name: CI / Release

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check out GabeTeX-Linux-Windows submodule
        run: |
          git submodule sync
          if git ls-remote --exit-code "https://github.com/${{ github.repository_owner }}/GabeTeX-Linux-Windows.git" >/dev/null 2>&1; then
            git config submodule.GabeTeX-Linux-Windows.url "https://github.com/${{ github.repository_owner }}/GabeTeX-Linux-Windows.git"
          fi
          git submodule update --init --recursive GabeTeX-Linux-Windows

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential libssl-dev xvfb file

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GabeTeX-Linux-Windows/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: GabeTeX-Linux-Windows/src-tauri

      - name: Install npm dependencies
        working-directory: GabeTeX-Linux-Windows
        run: npm ci

      - name: Build frontend
        working-directory: GabeTeX-Linux-Windows
        run: npm run build

      - name: Rust tests
        working-directory: GabeTeX-Linux-Windows/src-tauri
        run: cargo test

      - name: Build installers
        working-directory: GabeTeX-Linux-Windows
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build

      - name: Verify Linux glibc baseline
        if: matrix.name == 'linux'
        run: |
          BIN="GabeTeX-Linux-Windows/src-tauri/target/release/gabetex"
          if [ -f "$BIN" ] && readelf -V "$BIN" | grep -qE "GLIBC_2\.(3[6-9]|[4-9][0-9])"; then
            echo "Binary requires newer GLIBC than Ubuntu 22.04 (2.35):"
            readelf -V "$BIN" | grep -E "GLIBC_2\.[0-9]+"
            exit 1
          fi

      - name: Collect release assets
        run: |
          VERSION=$(node -p "require('./GabeTeX-Linux-Windows/src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION (${{ matrix.name }})"
          B=GabeTeX-Linux-Windows/src-tauri/target/release/bundle
          mkdir -p out
          case "${{ matrix.name }}" in
            linux)
              cp "$B/appimage/GabeTeX_${VERSION}_amd64.AppImage" out/ 2>/dev/null || true
              cp "$B/deb/GabeTeX_${VERSION}_amd64.deb" out/ 2>/dev/null || true
              ;;
            windows)
              cp "$B/nsis/GabeTeX_${VERSION}_x64-setup.exe" out/ 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_en-US.msi" out/ 2>/dev/null || true
              cp "$B/msi/GabeTeX_${VERSION}_x64_pt-BR.msi" out/ 2>/dev/null || true
              cp "$B/nsis/gabetex-standalone.exe" out/ 2>/dev/null || true
              cp GabeTeX-Linux-Windows/src-tauri/target/release/gabetex.exe out/gabetex-standalone.exe 2>/dev/null || true
              ;;
            macos)
              cp "$B/dmg/GabeTeX_${VERSION}"*.dmg out/ 2>/dev/null || true
              if [ -d "$B/macos/GabeTeX.app" ]; then
                tar -czf "out/GabeTeX_${VERSION}_macos.app.tar.gz" -C "$B/macos" GabeTeX.app 2>/dev/null || true
              fi
              cp GabeTeX-Linux-Windows/src-tauri/target/release/gabetex out/gabetex-macos-standalone 2>/dev/null || true
              ;;
          esac
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GabeTeX-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check out GabeTeX-Linux-Windows submodule
        run: |
          git submodule sync
          if git ls-remote --exit-code "https://github.com/${{ github.repository_owner }}/GabeTeX-Linux-Windows.git" >/dev/null 2>&1; then
            git config submodule.GabeTeX-Linux-Windows.url "https://github.com/${{ github.repository_owner }}/GabeTeX-Linux-Windows.git"
          fi
          git submodule update --init --recursive GabeTeX-Linux-Windows

      - name: Get version
        run: |
          VERSION=$(node -p "require('./GabeTeX-Linux-Windows/src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd out
          sha256sum * > GabeTeX-${VERSION}-SHA256SUMS.txt
          cat GabeTeX-${VERSION}-SHA256SUMS.txt

      - name: Write release notes
        run: |
          TAG="${{ github.ref_name }}"
          cat > release-notes.md <<'EOF'
          # GabeTeX v%%VERSION%%

          Automatic release generated by GitHub Actions from tag `%%TAG%%`.

          ## What's New & Fixes

          - **Tectonic WASM compiler**: embedded in-browser fallback with Beamer support and accurate `\today` local date resolution.
          - **Zotero integration**: browse Zotero collections/items and export BibTeX directly from Settings (with status & documentation link shown immediately).
          - **Appearance & localization**: Light/Dark/System themes, custom accent color with dynamic app icon, Brazilian Portuguese (`pt-BR`) UI, configurable auto-save, and multi-language spell checking (`en` / `pt-BR`).
          - **Accessibility**: per-page PDF landmarks, off-screen text fallback, accessible PDF links, and polite live compile/status announcements for screen readers.
          - **Installers & stability**: integrated TinyTeX setup inside the Windows NSIS installer (UTF-8 output, shortcuts, launch option), Ubuntu 22.04 (`glibc 2.35`) compatible `.AppImage` and `.deb`, plus `latexmk` rerun and Debian `tlmgr` recovery fixes.

          ## Artifacts

          Executables and installers built from `GabeTeX-Linux-Windows` (Tauri 2):

          - **Linux (Ubuntu 22.04+ / `glibc 2.35`)**: `.AppImage` and `.deb`
          - **Windows**: `.exe` (NSIS installer), `.msi`, and standalone `.exe`
          - **macOS (Tauri build)**: `.dmg`, `.app.tar.gz`, and standalone `gabetex-macos-standalone` *(for the native Swift macOS 26 app, see the [GabeTeX-macOS](https://github.com/gabe-rbo/GabeTeX-macOS/releases) repository)*

          ## SHA-256 Checksums

          See the attached file `GabeTeX-%%VERSION%%-SHA256SUMS.txt`.

          ## Verification

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-SHA256SUMS.txt
          ```

          ---

          # GabeTeX v%%VERSION%% (PT-BR)

          Release automática gerada pelo GitHub Actions a partir da tag `%%TAG%%`.

          ## Novidades e Correções

          - **Compilador Tectonic WASM**: compilação integrada em fallback sem distribuição TeX local, com suporte ao Beamer e data local correta em `\today`.
          - **Integração com Zotero**: navegação por coleções/itens e exportação para BibTeX nas Configurações (com status e link da documentação exibidos imediatamente).
          - **Aparência e idioma**: temas Claro/Escuro/Sistema, cor de destaque personalizada com ícone dinâmico, interface em Português do Brasil (`pt-BR`), salvamento automático configurável e corretor ortográfico em `en` / `pt-BR`.
          - **Acessibilidade**: marcação de páginas no preview de PDF, fallback de texto para leitores de tela, links acessíveis e anúncios ao vivo de compilação/status.
          - **Instaladores e estabilidade**: instalação integrada do TinyTeX no instalador Windows NSIS (saída UTF-8, atalhos e opção de execução), pacotes Linux `.AppImage` e `.deb` compatíveis com Ubuntu 22.04 (`glibc 2.35`), além de correções no `latexmk` e recuperação do `tlmgr` no Debian/Ubuntu.

          ## Artefatos

          Executáveis e instaladores compilados a partir de `GabeTeX-Linux-Windows` (Tauri 2):

          - **Linux (Ubuntu 22.04+ / `glibc 2.35`)**: `.AppImage` e `.deb`
          - **Windows**: `.exe` (instalador NSIS), `.msi` e `.exe` standalone
          - **macOS (build Tauri)**: `.dmg`, `.app.tar.gz` e executável standalone `gabetex-macos-standalone` *(para o app nativo Swift do macOS 26, consulte o repositório [GabeTeX-macOS](https://github.com/gabe-rbo/GabeTeX-macOS/releases))*

          ## Checksums SHA-256

          Veja o arquivo `GabeTeX-%%VERSION%%-SHA256SUMS.txt` anexado.

          ## Verificação

          ```sh
          sha256sum -c GabeTeX-%%VERSION%%-SHA256SUMS.txt
          ```
          EOF
          sed -i "s/%%VERSION%%/$VERSION/g; s/%%TAG%%/$TAG/g" release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "GabeTeX v$VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          fi
          gh release upload "$TAG" out/* --clobber
